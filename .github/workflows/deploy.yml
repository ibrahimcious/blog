name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Deploy to Cloudflare Workers
        run: |
          # The @astrojs/cloudflare 14 adapter still emits `legacy_env: true`,
          # which current wrangler rejects. It was the default behaviour, so
          # dropping the field is a no-op.
          node -e "const f='dist/server/wrangler.json',fs=require('fs'),j=JSON.parse(fs.readFileSync(f));delete j.legacy_env;fs.writeFileSync(f,JSON.stringify(j));"
          bunx wrangler@4 deploy -c dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
